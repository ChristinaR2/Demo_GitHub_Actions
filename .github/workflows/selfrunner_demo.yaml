name: Testing self-hosted runner

on:
  workflow_dispatch: 

jobs:
  test-selfhosted-runner:
    runs-on: self-hosted

    steps:
      - name: Display Computer name
        run: echo "Computer name = $env:COMPUTERNAME"
        shell: powershell

      - name: Display username
        run: echo "Username = $env:USERNAME"  

      - name: Display current working directory
        run: Get-Location
        shell: powershell

      - name: Display OS information
        run: systeminfo | findstr /B /C:"OS Name" /C:"OS Version"
        shell: powershell
